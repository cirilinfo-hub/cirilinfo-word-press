# Add inside the server {} block of your WordPress site.
# Private customer files (requirements, deliverables, ticket attachments) must never be served directly.
location ^~ /wp-content/uploads/cirilinfo-private/ {
    deny all;
    return 403;
}
# Block PHP execution in uploads
location ~* ^/wp-content/uploads/.*\.php$ { deny all; }
# Static asset caching
location ~* \.(?:css|js|woff2|svg|webp|avif|jpg|jpeg|png|gif|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
}
# Security headers (HSTS only after HTTPS works everywhere)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
