# Local development stack:  docker compose up -d && ./bin/setup-local.sh
services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes: [dbdata:/var/lib/mysql]
  wordpress:
    image: wordpress:php8.2-apache
    depends_on: [db]
    ports: ["8080:80"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DEBUG: "1"
    volumes:
      - wpdata:/var/www/html
      - ./wp-content/plugins/cirilinfo-core:/var/www/html/wp-content/plugins/cirilinfo-core
      - ./wp-content/themes/cirilinfo:/var/www/html/wp-content/themes/cirilinfo
  wpcli:
    image: wordpress:cli-php8.2
    depends_on: [wordpress]
    user: "33:33"
    volumes_from: [wordpress]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
volumes: { dbdata: {}, wpdata: {} }
